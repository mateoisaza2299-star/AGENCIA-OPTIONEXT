<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | OPTIONEXT</title>
  <meta name="description" content="Entra a tu cuenta de OPTIONEXT.">
  <meta name="theme-color" content="#4B2E9E">
  <link rel="icon" href="assets/optionext-logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
  <a class="skip" href="#contenido">Saltar al contenido</a>
  <header class="nav is-scrolled" id="nav">
    <div class="nav__bar">
      <a class="brand" href="index.html">
        <img class="brand__mark" src="assets/optionext-logo.png" width="48" height="48" alt="">
        <span class="brand__name">OPTIONEXT</span>
      </a>
      <button class="nav__toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="nav-panel">
        <span class="visually-hidden" id="menu-label">Abrir menú</span>
        <svg class="icon-menu" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="icon-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="nav__panel" id="nav-panel">
        <nav aria-label="Principal">
          <ul class="nav__links">
            <li><a href="index.html#nosotros">Nosotros</a></li>
            <li><a href="index.html#servicios">Servicios</a></li>
            <li><a href="index.html#precios">Precios</a></li>
            <li><a href="facturacion.html">Facturación</a></li>
            <li><a href="index.html#proceso">Proceso</a></li>
            <li><a href="index.html#contacto">Contacto</a></li>
          </ul>
        </nav>
        <a class="btn btn--primary btn--sm" href="index.html#contacto">Agenda un diagnóstico</a>
        <div class="nav-session" id="nav-session">
          <a class="btn btn--ghost btn--sm" href="login.html">Iniciar sesión</a>
        </div>
      </div>
    </div>
  </header>
  <main id="contenido" class="auth-main">
    <div class="container">
      <section class="auth-card" aria-labelledby="login-title">
        <p class="eyebrow">Cuenta</p>
        <h1 id="login-title">Iniciar sesión</h1>
        <p class="lede">Entra con el correo y la contraseña de tu cuenta.</p>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Correo</label>
            <input id="email" name="email" type="email" autocomplete="email" inputmode="email">
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password">
          </div>
          <p class="form-error" id="form-error" role="alert" hidden></p>
          <button class="btn btn--primary btn--block" id="login-submit" type="submit">Iniciar sesión</button>
        </form>
        <p class="auth-switch">¿Aún no tienes cuenta? <a href="registro.html">Crear cuenta</a></p>
      </section>
    </div>
  </main>
  <script type="module" src="js/login.js"></script>
</body>
</html>
